services:
  web-app:
    build: .
    container_name: web-app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=umkm_db
      - DB_PORT=3306
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: umkm_db
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: